name: alarm-filter

# web / backup are added in later phases (CLAUDE.md §4).
# Secrets come from .env (gitignored); see .env.example.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alarms}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    # Not published on purpose — only `web` is exposed (see docker-compose.dev.yml for local access).

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alarm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alarms}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alarm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alarms}
      ALARM_TZ: ${ALARM_TZ:-Africa/Cairo}
      GMAIL_QUERY: ${GMAIL_QUERY:-}
      OFFICE_LABEL_PARENTS: ${OFFICE_LABEL_PARENTS:-DN,DS}
      GOOGLE_TOKEN_PATH: /app/secrets/token.json
      GOOGLE_CREDENTIALS_PATH: /app/secrets/credentials.json
    volumes:
      # credentials.json is needed too: refreshing the access token requires the client secret.
      - ./token.json:/app/secrets/token.json:ro
      - ./credentials.json:/app/secrets/credentials.json:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks: [internal]
    # /health on :4000 is internal only (web reads SystemStatus from the db directly).

  api:
    # REST API (NestJS, apps/api) for the web pages and the mobile app. Internal only: the web
    # container proxies /api/* to it on :4100.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alarm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alarms}
      # Decrypts the web session cookie; also signs mobile tokens unless API_JWT_SECRET is set.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      API_JWT_SECRET: ${API_JWT_SECRET:-}
      ALARM_TZ: ${ALARM_TZ:-Africa/Cairo}
      ALERT_HOURS: ${ALERT_HOURS:-4}
      HOURLY_GMAIL_LABEL: ${HOURLY_GMAIL_LABEL:-Hourly Update}
      HOURLY_MAX_RAR_MB: ${HOURLY_MAX_RAR_MB:-25}
      HOURLY_MAX_EXTRACT_MB: ${HOURLY_MAX_EXTRACT_MB:-100}
      HOURLY_CACHE_MIN: ${HOURLY_CACHE_MIN:-30}
      GOOGLE_TOKEN_PATH: /app/secrets/token.json
      GOOGLE_CREDENTIALS_PATH: /app/secrets/credentials.json
    volumes:
      - ./token.json:/app/secrets/token.json:ro
      - ./credentials.json:/app/secrets/credentials.json:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
